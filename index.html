<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Kleuter Cijfer Pop</title>
<style>
  :root{
    --bg1:#f3f1ff;
    --bg2:#eaf7ff;
    --ink:#0b1020;
    --bubble-hl:#ffffff;
    --bubble-mid:#eff9ff;
    --bubble-lo:#d6f0ff;
    --bubble-glow:rgba(255,255,255,.85);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:rgba(0,0,0,0) }
  html,body{ margin:0; height:100%; background:#fff; color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
    overscroll-behavior:none; touch-action:none }
  #app{ position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden;
    background-color:#eaf7ff;
    background-image: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.08)), url("assets/achtergrond.png"), radial-gradient(120% 120% at 70% 20%, var(--bg1) 0%, var(--bg2) 60%, #ffffff 100%);
    background-size: cover, cover, cover;
    background-position: center, center, center;
    background-repeat: no-repeat;
    transition: background .6s ease }

  .parallax{ position:absolute; inset:-10%; pointer-events:none; filter:blur(20px); opacity:.35 }
  .blob{ position:absolute; width:35vmax; height:35vmax; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.65), rgba(255,255,255,0));
    animation: float 38s linear infinite; mix-blend-mode:screen }
  .blob.b2{ width:28vmax; height:28vmax; animation-duration:46s; opacity:.28 }
  .blob.b3{ width:40vmax; height:40vmax; animation-duration:52s; opacity:.26 }
  @keyframes float{ 0%{transform:translate3d(-10%,-10%,0)} 50%{transform:translate3d(10%,8%,0)} 100%{transform:translate3d(-10%,-10%,0)} }

  .ui{ position:absolute; left:0; right:0; top: env(safe-area-inset-top, 0px);
    display:flex; align-items:center; justify-content:flex-end; gap:12px; padding:12px 16px }
  .badge{ display:none }

  .controls{ display:flex; gap:10px }
  .imgbtn{ position:relative; width:58px; height:58px; border-radius:18px; border:0; padding:7px; background:rgba(255,255,255,.20);
    box-shadow: 0 8px 16px rgba(54,78,31,.22), inset 0 1px 0 rgba(255,255,255,.72); cursor:pointer; display:grid; place-items:center }
  .imgbtn img{ width:100%; height:100%; display:block; object-fit:contain; filter:drop-shadow(0 2px 2px rgba(35,51,20,.28)) }
  .imgbtn.music-off img{ opacity:.42 }
  .imgbtn.music-off::after{ content:""; position:absolute; width:42px; height:6px; border-radius:999px; background:#b3261e; box-shadow:0 1px 2px rgba(255,255,255,.8), 0 2px 4px rgba(50,30,20,.25); transform:rotate(-45deg); pointer-events:none }

  #startOverlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(211,232,179,.38)); backdrop-filter: blur(3px); text-align:center }
  #startOverlay.hidden{ display:none }
  #startOverlay .title{ font-size:clamp(22px, 3.8vmin, 30px); font-weight:1000 }
  #startOverlay .hint{ font-size:clamp(14px, 2.2vmin, 18px); opacity:.9 }
  .startbtn{ border:0; border-radius:9999px; padding:14px 26px; font-weight:1000;
    font-size:clamp(18px, 3.2vmin, 22px); color:#fff8dc; text-shadow:0 2px 2px rgba(73,43,13,.65);
    background:linear-gradient(180deg, #9bd46a, #4f9836);
    box-shadow: 0 8px 18px rgba(48,83,33,.26), inset 0 1px 0 rgba(255,255,255,.55); cursor:pointer }

  .bubble{
    position:absolute; z-index:1000; display:grid; place-items:center; border-radius:9999px;
    font-weight:1000; font-size:clamp(38px, 6.6vmin, 64px); color:#10334b; text-shadow:0 2px 2px rgba(255,255,255,.85), 0 0 8px rgba(255,255,255,.75);
    background-image: radial-gradient(circle at 30% 22%, rgba(255,255,255,.96) 0 10%, rgba(255,255,255,.46) 11% 20%, transparent 21%),
      radial-gradient(circle at 70% 78%, rgba(132,218,255,.35), transparent 35%),
      url("assets/bel.png"),
      radial-gradient(140% 140% at 35% 28%, rgba(255,255,255,.82) 0%, rgba(204,243,255,.36) 38%, rgba(93,196,236,.24) 72%, rgba(255,255,255,.18) 100%);
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
    border:2px solid rgba(220,250,255,.72);
    box-shadow: inset 8px 10px 18px rgba(255,255,255,.42), inset -10px -14px 22px rgba(66,165,209,.22), 0 14px 30px rgba(21,81,103,.18);
    transform: translate3d(0,0,0) scale(1); will-change:transform; user-select:none; -webkit-user-select:none; transition:transform .16s ease;
    backdrop-filter: blur(1.5px);
  }
  .bubble::before{ content:""; position:absolute; inset:-16%; border-radius:inherit;
    background: radial-gradient(circle at 50% 50%, rgba(202,246,255,.45), rgba(255,255,255,0) 62%); filter:blur(10px); z-index:-1 }
  .bubble::after{ content:""; position:absolute; top:14%; left:18%; width:30%; height:20%; border-radius:9999px; background: rgba(255,255,255,.72); filter: blur(1px); transform: rotate(-24deg); pointer-events:none }

  .pop{ animation: pop .33s cubic-bezier(.2,.9,.2,1) forwards }
  @keyframes pop{ 0%{transform: var(--t) scale(1) rotate(0); opacity:1} 45%{transform: var(--t) scale(1.25) rotate(5deg)} 100%{transform: var(--t) scale(.4) rotate(-10deg); opacity:0} }

  .ring{ position:absolute; pointer-events:none; border-radius:9999px; border:3px solid rgba(0,0,0,.12);
    transform: translate(-50%,-50%) scale(.6); opacity:.9; animation: ring .45s ease-out forwards }
  @keyframes ring{ to{ transform: translate(-50%,-50%) scale(1.45); opacity:0 } }
  .dot{ position:absolute; width:12px; height:12px; border-radius:9999px; opacity:.95; transform: translate(-50%,-50%) scale(1); animation: dot .55s ease-out forwards }
  @keyframes dot{ to{ transform: translate(var(--dx), var(--dy)) scale(.8); opacity:0 } }

  .helper{
    position:absolute;
    left:clamp(10px, 2vw, 22px);
    bottom:calc(58px + env(safe-area-inset-bottom, 0px));
    width:clamp(118px, 18vmin, 180px);
    height:clamp(118px, 18vmin, 180px);
    pointer-events:none;
    opacity:1;
    z-index:5;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .helper.show{
    opacity:1;
  }
  .helper img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center bottom;
    transform-origin:center bottom;
    transform:scale(var(--ladybug-scale, 1));
    filter:drop-shadow(0 8px 8px rgba(38,59,20,.28));
  }
  .helper.emotion-pop img{
    animation:helperPop .28s ease-out;
  }
  @keyframes helperPop{
    0%{ transform:scale(calc(var(--ladybug-scale, 1) * .96)) }
    60%{ transform:scale(calc(var(--ladybug-scale, 1) * 1.04)) }
    100%{ transform:scale(var(--ladybug-scale, 1)) }
  }

  #toast{ position:absolute; left:50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding:10px 14px; background: rgba(0,0,0,.08); border:1px solid rgba(0,0,0,.06); color:var(--ink); border-radius:12px; font-weight:900; font-size:14px; opacity:0; transition: opacity .25s ease; pointer-events:none }
  #toast.show{ opacity:1 }

  .teacher-toggle{ position:absolute; left:12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; gap:8px; z-index:3000 }
  .chip{ border:1px solid rgba(89,125,43,.35); background: linear-gradient(180deg, rgba(248,255,229,.95), rgba(177,218,112,.92));
    color:#31551c; box-shadow:0 5px 12px rgba(42,68,24,.18); padding:8px 12px; border-radius:9999px; font-weight:900; cursor:pointer }

  .panel{ position:absolute; left:12px; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width:min(96vw, 620px); max-height:84vh; overflow:auto; color:#2c4f19;
    background-color:rgba(250,255,229,.96); background-image:linear-gradient(rgba(255,255,255,.78), rgba(247,255,218,.88)), url("assets/instellingen.png");
    background-size:cover; background-position:center; border:2px solid rgba(112,153,58,.38); border-radius:22px; box-shadow: 0 12px 30px rgba(34,64,22,.22); padding:18px; display:none; z-index:4000 }
  .panel.show{ display:block }
  .panel h3{ margin:6px 6px 10px; font-size:18px; text-shadow:0 1px 0 rgba(255,255,255,.8) }
  .row{ display:flex; align-items:center; gap:10px; margin:10px 6px }
  .row label{ width:150px; font-weight:900; font-size:14px }
  .row input[type="range"]{ flex:1; accent-color:#79b84a; appearance:none; -webkit-appearance:none; height:28px; background:transparent }
  .row input[type="range"]::-webkit-slider-runnable-track{ height:14px; border-radius:999px; background-image:linear-gradient(90deg, rgba(146,204,93,.85), rgba(215,233,132,.76)), url("assets/slidervulling.png"), url("assets/slider.png"); background-size:100% 100%; background-position:center; border:1px solid rgba(73,111,36,.25) }
  .row input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:30px; height:30px; margin-top:-9px; border:0; background:url("assets/sliderschuif.png") center/contain no-repeat; filter:drop-shadow(0 2px 2px rgba(45,75,24,.28)) }
  .row input[type="range"]::-moz-range-track{ height:14px; border-radius:999px; background-image:linear-gradient(90deg, rgba(146,204,93,.85), rgba(215,233,132,.76)), url("assets/slidervulling.png"), url("assets/slider.png"); background-size:100% 100%; background-position:center; border:1px solid rgba(73,111,36,.25) }
  .row input[type="range"]::-moz-range-thumb{ width:30px; height:30px; border:0; background:url("assets/sliderschuif.png") center/contain no-repeat; filter:drop-shadow(0 2px 2px rgba(45,75,24,.28)) }
  .row input[type="number"]{ width:110px; padding:7px 9px; border-radius:12px; border:1px solid rgba(84,122,45,.32); background:rgba(255,255,255,.88); color:#2c4f19; font-weight:800 }
  #minNumberValue{ min-width:2.5em; font-weight:1000; color:#31551c }
  .panel .actions{ display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-top:16px }
  .panel .actions-right{ display:flex; gap:12px; flex-wrap:wrap }
  .panel button{ padding:10px 16px; border-radius:12px; border:1px solid rgba(79,120,41,.25); background: linear-gradient(180deg, #fff8c9, #91c95b); color:#31551c; font-weight:1000; cursor:pointer; box-shadow:0 4px 10px rgba(45,75,24,.16) }
  #saveTeacher{ min-width:120px; min-height:40px; background-image:linear-gradient(rgba(255,255,255,.1), rgba(121,181,75,.15)), url("assets/bewaar.png"); background-size:100% 100%; background-position:center; color:transparent }
  #closeTeacher{ min-width:110px; min-height:40px; background-image:linear-gradient(rgba(255,255,255,.1), rgba(121,181,75,.15)), url("assets/sluit.png"); background-size:100% 100%; background-position:center; color:transparent }
  #previewBtn{ background: linear-gradient(180deg, #fff8c9, #91c95b) !important; color:#31551c }

  .slide-in{ transition: transform .9s cubic-bezier(.2,.9,.2,1) }

  /* Log overlay, los van #app, iPad en Windows vriendelijk */
  #logOverlay{
    position:fixed; inset:0; z-index:999999;
    background: rgba(218,239,181,.72);
    backdrop-filter: blur(6px);
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  #logOverlay.show{ display:flex }
  .logcard{ width:min(92vw, 560px); max-height:76vh; background:#fffdea; border:2px solid rgba(112,153,58,.35);
    border-radius:18px; box-shadow:0 12px 28px rgba(34,64,22,.22); display:flex; flex-direction:column; overflow:hidden }
  .logcard header{ padding:12px 14px; font-weight:900; border-bottom:1px solid rgba(0,0,0,.06); display:flex; justify-content:space-between; align-items:center }
  .logcard header button{ border:0; background:rgba(0,0,0,.06); border-radius:10px; padding:6px 10px; font-weight:900; cursor:pointer }
  .loglist{ padding:12px; overflow:auto; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; -webkit-overflow-scrolling:touch }
</style>
</head>
<body>
  <div id="app" role="application" aria-label="Kleuter Cijfer Pop">
    <div class="parallax" aria-hidden="true">
      <div class="blob" style="left:-8%; top:-6%"></div>
      <div class="blob b2" style="right:-6%; top:10%"></div>
      <div class="blob b3" style="left:20%; bottom:-12%"></div>
    </div>

    <div class="ui">
      <div class="badge" id="badge">Tik de cijfers op volgorde</div>
      <div class="controls">
        <button class="imgbtn" id="vraagBtn" type="button" aria-label="Vraag">
          <img src="assets/vraagteken.png" alt="Vraag">
        </button>
        <button class="imgbtn" id="nogeensBtn" type="button" aria-label="Nog eens">
          <img src="assets/nog eens.png" alt="Nog eens">
        </button>
        <button class="imgbtn" id="musicBtn" type="button" aria-label="Muziek aan of uit" aria-pressed="false" title="Muziek aan of uit">
          <img id="musicIcon" src="assets/muziek.png" alt="Muziek uit">
        </button>
      </div>
    </div>

    <div id="helper" class="helper" aria-hidden="true">
      <img id="helperImg" src="assets/lieveheersbeestje_03_denkend.png" alt="">
    </div>

    <div id="startOverlay" aria-modal="true" role="dialog">
      <div class="title">Klaar voor het spel</div>
      <div class="hint">Klik de cijfers, op volgorde</div>
      <button class="startbtn" id="startBtn" type="button" aria-label="Start">Start</button>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div class="teacher-toggle">
      <button class="chip" id="teacherBtn" type="button">Leerkracht</button>
      <!-- extra directe logknop voor Windows betrouwbaarheid -->
      <button class="chip" id="logBtn" type="button">Log</button>
    </div>

    <div class="panel" id="teacherPanel" role="dialog" aria-label="Leerkracht instellingen">
      <h3>Instellingen</h3>
      <div class="row"><label for="maxWave">Maximaal cijfer</label><input id="maxWave" type="number" min="3" max="100" step="1" /></div>
      <div class="row"><label for="minNumber">Minimumcijfer</label><input id="minNumber" type="range" min="1" max="100" step="1" /><span id="minNumberValue">1</span></div>
      <div class="row"><label for="delay">Tijd tussen levels, seconden</label><input id="delay" type="number" min="0" max="5" step="0.1" /></div>
      <div class="row"><label>Snelheid bubbels</label><input id="minSpeed" type="range" min="4" max="40" step="1" /><input id="maxSpeed" type="range" min="6" max="50" step="1" /></div>
      <div class="row"><label for="vol">Volume stem</label><input id="vol" type="range" min="0" max="1" step="0.05" /></div>
      <div class="row"><label for="musicVol">Volume muziek</label><input id="musicVol" type="range" min="0" max="1" step="0.05" /></div>

      <div class="row" style="align-items:flex-start">
        <label>Bekijk log</label>
        <div>
          <button id="previewBtn" type="button" style="padding:8px 12px; border-radius:10px; border:1px solid rgba(0,0,0,.1); background: rgba(0,0,0,.06); font-weight:900; cursor:pointer">Bekijk</button>
          <div style="font-size:12px; opacity:.8; margin-top:6px">Log toont fouten met datum, tijd en details</div>
        </div>
      </div>

      <div class="actions">
        <button id="resetTeacher" type="button">Reset</button>
        <div class="actions-right">
          <button id="saveTeacher" type="button" aria-label="Bewaar"></button>
          <button id="closeTeacher" type="button" aria-label="Sluit"></button>
        </div>
      </div>
    </div>

    <audio id="bgm" src="soft-ambient-textures-with-subtle-bird-chirps-377058.mp3" loop preload="auto"></audio>
  </div>

  <div id="logOverlay" aria-modal="true" role="dialog" aria-hidden="true" style="display:none">
    <div class="logcard" role="document">
      <header>
        <div>Foutenlog</div>
        <div style="display:flex;gap:8px">
          <button id="clearLogBtn" type="button">Wis</button>
          <button id="closeLogBtn" type="button">Sluit</button>
        </div>
      </header>
      <div id="logList" class="loglist">Geen fouten geregistreerd</div>
    </div>
  </div>

<script>
;(() => {
  const app = document.getElementById('app')
  const startOverlay = document.getElementById('startOverlay')
  const startBtn = document.getElementById('startBtn')
  const vraagBtn = document.getElementById('vraagBtn')
  const nogeensBtn = document.getElementById('nogeensBtn')
  const toast = document.getElementById('toast')
  const badge = document.getElementById('badge')
  const helper = document.getElementById('helper')
  const helperImg = document.getElementById('helperImg')

  const LADYBUG = {
    neutral: 'assets/lieveheersbeestje_03_denkend.png',
    happy: 'assets/lieveheersbeestje_01_blij.png',
    sad: 'assets/lieveheersbeestje_02_verdrietig.png',
    surprised: 'assets/lieveheersbeestje_04_verbaasd.png',
    determined: 'assets/lieveheersbeestje_05_boos_vastberaden.png',
    waving: 'assets/lieveheersbeestje_06_zwaaiend.png',
    victory: 'assets/lieveheersbeestje_08_springend_victorie.png'
  }

  const LADYBUG_SCALE = {
    neutral: 1.02,
    happy: 1,
    sad: 1.06,
    surprised: 1.02,
    determined: 1.04,
    waving: 1,
    victory: 1
  }

  let currentLadybugEmotion = 'neutral'
  let currentDefaultEmotion = 'neutral'
  let helperEmotionTimer = 0

  function pickRandomFrom(list, avoid = null){
    const filtered = avoid ? list.filter(item => item !== avoid) : list.slice()
    const pool = filtered.length ? filtered : list
    return pool[Math.floor(Math.random() * pool.length)]
  }
  function pickDefaultEmotion(){
    const next = pickRandomFrom(['neutral', 'happy'], currentDefaultEmotion)
    currentDefaultEmotion = next
    return next
  }
  function pickErrorEmotion(){
    return pickRandomFrom(['sad', 'surprised', 'determined'], currentLadybugEmotion)
  }
  function pickSuccessEmotion(){
    return pickRandomFrom(['victory', 'waving'], currentLadybugEmotion)
  }

  function setLadybugEmotion(emotion, fallbackAfterMs = 0, fallbackEmotion = null){
    if(!helperImg || !helper || !LADYBUG[emotion]) return

    clearTimeout(helperEmotionTimer)

    if(currentLadybugEmotion === emotion){
      if(fallbackAfterMs > 0 && fallbackEmotion){
        helperEmotionTimer = setTimeout(() => {
          setLadybugEmotion(fallbackEmotion)
        }, fallbackAfterMs)
      }
      return
    }

    currentLadybugEmotion = emotion
    helperImg.src = LADYBUG[emotion]
    helperImg.style.setProperty('--ladybug-scale', LADYBUG_SCALE[emotion] || 1)

    helper.classList.remove('emotion-pop')
    void helper.offsetWidth
    helper.classList.add('emotion-pop')

    if(fallbackAfterMs > 0 && fallbackEmotion){
      helperEmotionTimer = setTimeout(() => {
        setLadybugEmotion(fallbackEmotion)
      }, fallbackAfterMs)
    }
  }

  function setLadybugDefault(){
    setLadybugEmotion(pickDefaultEmotion())
  }

  const teacherBtn = document.getElementById('teacherBtn')
  const teacherPanel = document.getElementById('teacherPanel')
  const saveTeacher = document.getElementById('saveTeacher')
  const closeTeacher = document.getElementById('closeTeacher')
  const inputMaxWave = document.getElementById('maxWave')
  const inputMinNumber = document.getElementById('minNumber')
  const minNumberValue = document.getElementById('minNumberValue')
  const inputDelay = document.getElementById('delay')
  const inputMinSpeed = document.getElementById('minSpeed')
  const inputMaxSpeed = document.getElementById('maxSpeed')
  const inputVol = document.getElementById('vol')
  const inputMusicVol = document.getElementById('musicVol')
  const previewBtn = document.getElementById('previewBtn')
  const logBtn = document.getElementById('logBtn')
  const resetTeacher = document.getElementById('resetTeacher')

  const logOverlay = document.getElementById('logOverlay')
  const logList = document.getElementById('logList')
  const closeLogBtn = document.getElementById('closeLogBtn')
  const clearLogBtn = document.getElementById('clearLogBtn')
  let logOverlayMode = 'public'

  const bgm = document.getElementById('bgm')

  const musicBtn = document.getElementById('musicBtn')
  const musicIcon = document.getElementById('musicIcon')

  const PASTELS = [
    ['#fde2e4','#fff1f1'], ['#dfe7fd','#eef3ff'], ['#e4f1e1','#f2faef'],
    ['#fff4cc','#fff9e6'], ['#f3e8ff','#f9f2ff'], ['#eaf7ff','#f5fbff'],
    ['#ffe9f2','#fff3f8'], ['#e9fff5','#f3fffa'], ['#fff0e6','#fff7f2'], ['#eef7ff','#f6fbff']
  ]
  const NUM_WORDS_NL = {
    0:'nul', 1:'één', 2:'twee', 3:'drie', 4:'vier', 5:'vijf',
    6:'zes', 7:'zeven', 8:'acht', 9:'negen', 10:'tien',
    11:'elf', 12:'twaalf', 13:'dertien', 14:'veertien',
    15:'vijftien', 16:'zestien', 17:'zeventien', 18:'achttien',
    19:'negentien', 20:'twintig', 30:'dertig', 40:'veertig',
    50:'vijftig', 60:'zestig', 70:'zeventig', 80:'tachtig',
    90:'negentig', 100:'honderd'
  }

  const SETTINGS_KEY = 'kleuter_cijferpop_settings'
  const LOG_KEY = 'kleuter_cijferpop_log'
  const DEFAULT_SETTINGS = {
    maxWave: 100,
    minNumber: 1,
    interLevelDelay: 1.8,
    minSpeed: 10,
    maxSpeed: 22,
    voiceVolume: 1.0,
    musicVolume: 0.18,
    musicEnabled: true
  }

  const safeStore = (() => {
    let memory = {}
    let ok = true
    try{ const t='__test__'+Math.random(); localStorage.setItem(t,'1'); localStorage.removeItem(t) }catch(e){ ok=false }
    return {
      get(key){ try{ if(ok){ const v = localStorage.getItem(key); return v === 'null' ? null : v } return key in memory ? memory[key] : null }catch(e){ return null } },
      set(key, val){ try{ if(ok) localStorage.setItem(key,val); else memory[key]=val; return true }catch(e){ return false } }
    }
  })()
  function readJSON(key, fallback){
    try{
      const raw = safeStore.get(key)
      if(raw === null || raw === undefined) return fallback
      const v = JSON.parse(raw)
      return v === null ? fallback : v
    }catch(e){ return fallback }
  }
  function writeJSON(key, obj){
    try{ safeStore.set(key, JSON.stringify(obj)) }catch(e){}
  }

  const state = {
    moving:false,
    wave:1,
    requiredNext:1,
    maxWave:10,
    minNumber:1,
    bubbles:[],
    velocities:[],
    jerkMeta:new Map(),
    animationRAF:0,
    lastTime:0,
    voice:null,
    voicePrimed:false,
    voicesLoaded:false,
    minSpeed:10,
    maxSpeed:22,
    minSize:110,
    maxSize:190,
    interLevelDelay:1.8,
    logging:true,
    idleMs:5000,
    lastInteraction:0,

  function clampNum(v,a,b){ return Math.max(a, Math.min(b, v)) }
  function clampInt(v,a,b){ return Math.max(a, Math.min(b, v|0)) }
  function rand(min,max){ return Math.random() * (max - min) + min }

  function setPastelForWave(wave){
    const pair = PASTELS[(wave - 1) % PASTELS.length]
    document.documentElement.style.setProperty('--bg1', pair[0])
    document.documentElement.style.setProperty('--bg2', pair[1])
  }

  function resize(){ app.style.width = innerWidth + 'px'; app.style.height = innerHeight + 'px' }
  addEventListener('resize', resize, {passive:true})
  addEventListener('orientationchange', () => setTimeout(resize, 250))

  function showToast(msg){
    toast.textContent = msg
    toast.classList.add('show')
    clearTimeout(showToast._t)
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1200)
  }

  // TTS
  function loadVoices(){
    return new Promise(resolve => {
      const got = speechSynthesis.getVoices()
      if(got && got.length){ resolve(got) }
      else{
        const onv = () => { speechSynthesis.onvoiceschanged = null; resolve(speechSynthesis.getVoices()) }
        speechSynthesis.onvoiceschanged = onv
        setTimeout(onv, 1200)
      }
    })
  }
  function isFemaleName(name=''){ return /(claire|saskia|ellen|lotte|femke|mila|maja|vrouw|female|woman)/i.test(name) }
  function pickDutchFemale(vs){
    const nl = vs.filter(v => v.lang && v.lang.toLowerCase().startsWith('nl'))
    const fem = nl.filter(v => isFemaleName(v.name))
    return fem[0] || nl[0] || vs.find(v => isFemaleName(v.name)) || vs[0] || null
  }
  function word(n){
    if(NUM_WORDS_NL[n]) return NUM_WORDS_NL[n]
    if(n > 20 && n < 100){
      const ones = n % 10
      const tens = n - ones
      return `${NUM_WORDS_NL[ones]}ën${NUM_WORDS_NL[tens]}`
    }
    return String(n)
  }

  async function ensureTTSReady(){
    if(state.voicePrimed && state.voicesLoaded) return
    try{
      const u = new SpeechSynthesisUtterance('.')
      u.lang='nl-NL'; u.volume=0.01; u.rate=1
      u.onend = () => { state.voicePrimed = true }
      speechSynthesis.speak(u)
    }catch(e){}
    try{
      const vs = await loadVoices()
      state.voice = pickDutchFemale(vs)
      state.voicesLoaded = true
    }catch(e){}
  }

  function speak(text, rate=state.friendlyRate, opts={interrupt:true}){
    try{
      if(opts.interrupt) speechSynthesis.cancel()
      const u = new SpeechSynthesisUtterance(text)
      u.lang='nl-NL'
      u.rate=rate
      u.pitch=state.friendlyPitch
      u.volume=state.voiceVolume
      if(state.voice) u.voice=state.voice
      speechSynthesis.speak(u)
    }catch(e){}
  }

  // iPad/Safari kan speechSynthesis niet altijd stabiel routen naar extern audio/scherm; dit versnelt en stabiliseert lokaal gedrag, maar garandeert die routing niet.
  function speakFast(text, rate=state.numberRate, opts={interrupt:true}){
    try{
      if(opts.interrupt) speechSynthesis.cancel()
      if(speechSynthesis.paused) speechSynthesis.resume()
      speechSynthesis.resume()

      const u = new SpeechSynthesisUtterance(text)
      u.lang = 'nl-NL'
      u.rate = rate
      u.pitch = state.friendlyPitch
      u.volume = state.voiceVolume
      if(state.voice) u.voice = state.voice

      speechSynthesis.speak(u)
    }catch(e){}
  }



  let bgmPausedByVisibility = false

  function pauseAllAudioForHiddenState(){
    try{
      if(!bgm.paused){
        bgmPausedByVisibility = true
        bgm.pause()
      }
    }catch(e){}

    try{
      speechSynthesis.cancel()
    }catch(e){}
  }

  async function resumeMusicAfterHiddenState(){
    if(!state.gameStarted) return
    if(!state.musicEnabled) return
    if(document.visibilityState && document.visibilityState !== 'visible') return

    try{
      if(bgmPausedByVisibility || bgm.paused){
        await bgm.play()
      }
    }catch(e){}
    bgmPausedByVisibility = false
    updateMusicButtonUI()
  }
  // Muziek
  function applyMusicSettings(){
    bgm.volume = clampNum(state.musicVolume, 0, 1)
    updateMusicButtonUI()
  }
  async function startMusicIfEnabled(){
    try{
      applyMusicSettings()
      if(state.musicEnabled && bgm.paused && (!document.visibilityState || document.visibilityState === 'visible')){
        await bgm.play()
      }
    }catch(e){}
    bgmPausedByVisibility = false
    updateMusicButtonUI()
  }
  function updateMusicButtonUI(){
    const on = state.musicEnabled && !bgm.paused
    if(musicBtn){
      musicBtn.setAttribute('aria-pressed', on ? 'true' : 'false')
      musicBtn.title = on ? 'Muziek uit' : 'Muziek aan'
      musicBtn.classList.toggle('music-off', !on)
    }
    if(musicIcon){
      musicIcon.src = 'assets/muziek.png'
      musicIcon.alt = on ? 'Muziek aan' : 'Muziek uit'
    }
  }
  async function toggleMusic(){
    state.musicEnabled = !state.musicEnabled
    applyMusicSettings()
    try{
      if(state.musicEnabled){
        if(!document.visibilityState || document.visibilityState === 'visible') await bgm.play()
      }else{
        bgm.pause()
      }
    }catch(e){}
    if(!state.musicEnabled) bgmPausedByVisibility = false
    writeJSON(SETTINGS_KEY, {
      maxWave: state.maxWave,
      minNumber: state.minNumber,
      interLevelDelay: state.interLevelDelay,
      minSpeed: state.minSpeed,
      maxSpeed: state.maxSpeed,
      voiceVolume: state.voiceVolume,
      musicVolume: state.musicVolume,
      musicEnabled: state.musicEnabled
    })
    updateMusicButtonUI()
  }

  // Settings
  function loadSettings(){
    try{
      const s = readJSON(SETTINGS_KEY, null)
      if(s){
        if(typeof s.maxWave === 'number') state.maxWave = s.maxWave
        if(typeof s.minNumber === 'number') state.minNumber = s.minNumber
        if(typeof s.interLevelDelay === 'number') state.interLevelDelay = s.interLevelDelay
        if(typeof s.minSpeed === 'number') state.minSpeed = s.minSpeed
        if(typeof s.maxSpeed === 'number') state.maxSpeed = s.maxSpeed
        if(typeof s.voiceVolume === 'number') state.voiceVolume = clampNum(s.voiceVolume, 0, 1)
        if(typeof s.musicVolume === 'number') state.musicVolume = clampNum(s.musicVolume, 0, 1)
        if(typeof s.musicEnabled === 'boolean') state.musicEnabled = s.musicEnabled
      }
    }catch(e){}
    state.maxWave = clampInt(state.maxWave, 3, 100)
    state.minNumber = clampInt(state.minNumber, 1, state.maxWave)
    inputMaxWave.value = state.maxWave
    inputMinNumber.max = state.maxWave
    inputMinNumber.value = state.minNumber
    minNumberValue.textContent = state.minNumber
    inputDelay.value = state.interLevelDelay
    inputMinSpeed.value = state.minSpeed
    inputMaxSpeed.value = state.maxSpeed
    inputVol.value = state.voiceVolume
    inputMusicVol.value = state.musicVolume
    updateMusicButtonUI()
  }
  function applySettingsToInputs(settings){
    inputMaxWave.value = settings.maxWave
    inputMinNumber.max = settings.maxWave
    inputMinNumber.value = settings.minNumber
    minNumberValue.textContent = settings.minNumber
    inputDelay.value = settings.interLevelDelay
    inputMinSpeed.value = settings.minSpeed
    inputMaxSpeed.value = settings.maxSpeed
    inputVol.value = settings.voiceVolume
    inputMusicVol.value = settings.musicVolume
  }
  function resetSettingsToDefault(){
    state.maxWave = DEFAULT_SETTINGS.maxWave
    state.minNumber = DEFAULT_SETTINGS.minNumber
    state.interLevelDelay = DEFAULT_SETTINGS.interLevelDelay
    state.minSpeed = DEFAULT_SETTINGS.minSpeed
    state.maxSpeed = DEFAULT_SETTINGS.maxSpeed
    state.voiceVolume = DEFAULT_SETTINGS.voiceVolume
    state.musicVolume = DEFAULT_SETTINGS.musicVolume
    state.musicEnabled = DEFAULT_SETTINGS.musicEnabled
    applySettingsToInputs(DEFAULT_SETTINGS)
    applyMusicSettings()
    writeJSON(SETTINGS_KEY, DEFAULT_SETTINGS)
    showToast('Instellingen hersteld')
  }
  function saveSettings(){
    state.maxWave = clampInt(parseInt(inputMaxWave.value,10), 3, 100)
    state.minNumber = clampInt(parseInt(inputMinNumber.value,10), 1, state.maxWave)
    if(state.minNumber > state.maxWave) state.minNumber = state.maxWave
    inputMaxWave.value = state.maxWave
    inputMinNumber.max = state.maxWave
    inputMinNumber.value = state.minNumber
    minNumberValue.textContent = state.minNumber
    state.interLevelDelay = clampNum(parseFloat(inputDelay.value), 0, 5)
    state.minSpeed = clampNum(parseFloat(inputMinSpeed.value), 2, 40)
    state.maxSpeed = clampNum(parseFloat(inputMaxSpeed.value), state.minSpeed+1, 50)
    state.voiceVolume = clampNum(parseFloat(inputVol.value), 0, 1)
    state.musicVolume = clampNum(parseFloat(inputMusicVol.value), 0, 1)
    applyMusicSettings()
    writeJSON(SETTINGS_KEY, {
      maxWave: state.maxWave,
      minNumber: state.minNumber,
      interLevelDelay: state.interLevelDelay,
      minSpeed: state.minSpeed,
      maxSpeed: state.maxSpeed,
      voiceVolume: state.voiceVolume,
      musicVolume: state.musicVolume,
      musicEnabled: state.musicEnabled
    })
    showToast('Instellingen bewaard')
  }

  // Datum tijd
  function pad2(n){ return n < 10 ? '0' + n : '' + n }
  function nowDateParts(){
    const d = new Date()
    const dag = pad2(d.getDate())
    const maand = pad2(d.getMonth()+1)
    const jaar = d.getFullYear()
    const uur = pad2(d.getHours())
    const min = pad2(d.getMinutes())
    return { datum: `${dag},${maand},${jaar}`, tijd: `${uur}:${min}` }
  }

  // Log
  function logError(level, need, clicked){
    const { datum, tijd } = nowDateParts()
    const entry = { datum, tijd, level, verwacht: need, geklikt: clicked }
    const arr = readJSON(LOG_KEY, [])
    arr.push(entry)
    writeJSON(LOG_KEY, arr)
  }
  function renderLogIntoOverlay(){
    const arr = readJSON(LOG_KEY, [])
    if(!arr.length){ logList.textContent = 'Geen fouten geregistreerd'; return }
    logList.textContent = arr.map(e => [
      `datum: ${e.datum}`,
      `tijd: ${e.tijd}`,
      `ik zat in level: ${e.level}`,
      `Het cijfer waarop ik moest klikken was: ${e.verwacht}`,
      `maar ik klikte op cijfer: ${e.geklikt}`
    ].join('\n')).join('\n\n')
  }

  // Overlay helpers, micro delay voor Windows
  function openLogOverlay(mode = 'public'){
    logOverlayMode = mode
    renderLogIntoOverlay()
    if(clearLogBtn){
      clearLogBtn.style.display = mode === 'teacher' ? 'inline-block' : 'none'
    }

      logOverlay.style.display = 'flex'

    logOverlay.style.display = 'none'
    logOverlay.setAttribute('aria-hidden', 'true')

  // Helperhand
  function hideHelper(){
    // Helper blijft altijd zichtbaar
  }
  function maybeShowHelper(){
    // Geen zichtbaarheid aanpassen
  }
  function registerInteraction(){ state.lastInteraction = performance.now(); hideHelper() }
  document.addEventListener('pointerdown', registerInteraction, {passive:true})

  // Bubbels
  function clearBubbles(){
    for(const b of state.bubbles){ b.removeEventListener('pointerdown', onBubbleTap); b.remove() }
    state.bubbles = []; state.velocities = []; state.jerkMeta.clear()
  }
  function setTransform(el,x,y){ el.style.setProperty('--t', `translate3d(${x}px, ${y}px, 0)`); el.style.transform = `translate3d(${x}px, ${y}px, 0)` }
  function overlapsExisting(x,y,size){
    for(const b of state.bubbles){
      const bx = parseFloat(b.dataset.x), by = parseFloat(b.dataset.y), bs = parseFloat(b.dataset.size)
      const dx = (bx + bs*.5) - (x + size*.5), dy = (by + bs*.5) - (y + size*.5)
      const rr = (bs*.5 + size*.5); if(dx*dx + dy*dy < rr*rr * 0.92) return true
    }
    return false
  }

  function currentMaxNumber(){
    return Math.min(state.maxWave, state.minNumber + state.wave - 1)
  }

  function createWaveBubbles(){
    clearBubbles()
    const W = app.clientWidth, H = app.clientHeight, pad = 16
    const endNumber = currentMaxNumber()
    for(let n=state.minNumber; n<=endNumber; n++){
      const el = document.createElement('div')
      el.className = 'bubble'; el.textContent = n; el.dataset.num = n
      const baseMin = Math.max(110, Math.min(innerWidth, innerHeight) * 0.16)
      const baseMax = Math.max(190, Math.min(innerWidth, innerHeight) * 0.26)
      const size = Math.floor(rand(baseMin, baseMax))
      el.style.width = size + 'px'; el.style.height = size + 'px'
      el.style.zIndex = String(1000 + state.bubbles.length)

      let x = rand(pad, Math.max(pad, W - size)), y = rand(pad + 70, Math.max(pad + 70, H - size)), tries = 0
      while(overlapsExisting(x,y,size) && tries < 240){
        x = rand(pad, Math.max(pad, W - size)); y = rand(pad + 70, Math.max(pad + 70, H - size)); tries++
      }
      setTransform(el, x, y)
      el.dataset.x = x; el.dataset.y = y; el.dataset.size = size
      el.addEventListener('pointerdown', onBubbleTap, {passive:true})

      const sp = rand(state.minSpeed, state.maxSpeed), ang = rand(0, Math.PI*2)
      const v = { vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp }

      app.appendChild(el)
      state.bubbles.push(el); state.velocities.push(v)
      state.jerkMeta.set(el, { nextJerk: performance.now() + rand(300, 800) })
    }
    enforceStacking()
  }

  function enforceStacking(){
    let minN = Infinity
    for(const b of state.bubbles){
      if(b.classList.contains('pop')) continue
      const n = parseInt(b.dataset.num, 10)
      if(Number.isFinite(n) && n < minN) minN = n
    }

    for(const b of state.bubbles){
      const n = parseInt(b.dataset.num, 10)
      b.style.zIndex = n === minN ? '2000' : String(1000 - n)
    }
  }

  function burst(x,y,baseSize){
    const ring = document.createElement('div'); ring.className = 'ring'
    const r = Math.max(30, baseSize * 0.55)
    ring.style.width = r + 'px'; ring.style.height = r + 'px'; ring.style.left = x + 'px'; ring.style.top = y + 'px'
    app.appendChild(ring); ring.addEventListener('animationend', () => ring.remove(), {once:true})
    const colors = ['#ffd6e7','#e2f2ff','#e6ffe8','#fff3d6','#f3e8ff']
    for(let i=0;i<3;i++){
      const d = document.createElement('div'); d.className = 'dot'
      d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.background = colors[Math.floor(Math.random()*colors.length)]
      const dist = Math.max(28, baseSize * 0.35), ang = rand(0, Math.PI*2)
      d.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); d.style.setProperty('--dy', Math.sin(ang) * dist + 'px')
      app.appendChild(d); d.addEventListener('animationend', () => d.remove(), {once:true})
    }
  }

  async function onBubbleTap(e){
    const el = e.currentTarget
    const n = parseInt(el.dataset.num, 10)
    if(!state.bubbles.includes(el)) return
    if(el.classList.contains('pop')) return
    const correct = n === state.requiredNext
    const isLastBubble = state.bubbles.length === 1

    if(!correct){
      logError(state.wave, state.requiredNext, n)
      showToast(`Fout, begin opnieuw bij ${state.minNumber}`)
      const fallbackDefault = pickDefaultEmotion()
      setLadybugEmotion(pickErrorEmotion(), 2200, fallbackDefault)
      restartCurrentWaveWithoutTeleport()
      speakFast(`Oeps, begin opnieuw bij ${word(state.minNumber)}`, state.friendlyRate, {interrupt:true})
      return
    }

    speakFast(word(n), state.numberRate, {interrupt:true})

    if(isLastBubble){
      const fallbackDefault = pickDefaultEmotion()
      setLadybugEmotion(pickSuccessEmotion(), 2200, fallbackDefault)
    }

    const nextAfterTap = state.requiredNext + 1
    state.requiredNext = nextAfterTap

    const rect = el.getBoundingClientRect()

    el.addEventListener('animationend', () => {
      const idx = state.bubbles.indexOf(el)
      if(idx >= 0){ state.bubbles.splice(idx, 1); state.velocities.splice(idx, 1); state.jerkMeta.delete(el) }
      el.remove()
      if(state.bubbles.length === 0){
        setTimeout(() => {
          nextWave()
        }, state.interLevelDelay * 1000)
      }else{
        enforceStacking()
      }
    }, {once:true})

    el.classList.add('pop')
    enforceStacking()
    burst(rect.left + rect.width/2, rect.top + rect.height/2, parseFloat(el.dataset.size))

  }

  function restartCurrentWaveWithoutTeleport(){
    const have = new Set(state.bubbles.filter(b => !b.classList.contains('pop')).map(b => parseInt(b.dataset.num,10)))
    state.requiredNext = state.minNumber
    const missing = []
    const endNumber = currentMaxNumber()
    for(let n=state.minNumber; n<=endNumber; n++){ if(!have.has(n)) missing.push(n) }

    const W = app.clientWidth, H = app.clientHeight, pad = 16
    for(const n of missing){
      const el = document.createElement('div')
      el.className = 'bubble slide-in'
      el.textContent = n
      el.dataset.num = n
      const baseMin = Math.max(110, Math.min(innerWidth, innerHeight) * 0.16)
      const baseMax = Math.max(190, Math.min(innerWidth, innerHeight) * 0.26)
      const size = Math.floor(rand(baseMin, baseMax))
      el.style.width = size + 'px'; el.style.height = size + 'px'
      el.style.zIndex = String(1000 + state.bubbles.length)

      let targetX = rand(pad, Math.max(pad, W - size))
      let targetY = rand(pad + 70, Math.max(pad + 70, H - size))
      let tries = 0
      while(overlapsExisting(targetX, targetY, size) && tries < 240){
        targetX = rand(pad, Math.max(pad, W - size))
        targetY = rand(pad + 70, Math.max(pad + 70, H - size))
        tries++
      }

      const side = Math.random() < 0.5 ? 'left' : 'right'
      const startX = side === 'left' ? -size - 20 : W + 20
      const startY = targetY

      setTransform(el, startX, startY)
      el.dataset.x = targetX; el.dataset.y = targetY; el.dataset.size = size
      el.addEventListener('pointerdown', onBubbleTap, {passive:true})

      const sp = rand(state.minSpeed, state.maxSpeed)
      const ang = Math.atan2(targetY - startY, targetX - startX)
      const v = { vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp }

      app.appendChild(el)
      state.bubbles.push(el); state.velocities.push(v); state.jerkMeta.set(el, { nextJerk: performance.now() + rand(300, 800) })

      requestAnimationFrame(() => {
        el.style.transition = 'transform .9s cubic-bezier(.2,.9,.2,1)'
        setTransform(el, targetX, targetY)
        setTimeout(() => { el.style.transition = '' }, 900)
      })
    }

    badge.textContent = `Tik de cijfers op volgorde, begin met ${state.minNumber}`
    enforceStacking()
    state.lastInteraction = performance.now()
  }

  function nextWave(){
    state.wave += 1

    if(state.minNumber + state.wave - 1 > state.maxWave){
      state.wave = 1
      showToast(`We beginnen opnieuw bij ${state.minNumber}`)
      speak(`We beginnen opnieuw bij ${word(state.minNumber)}`, state.friendlyRate, {interrupt:true})
    }else{
      const endNumber = currentMaxNumber()
      showToast(`Nu tot en met ${endNumber}`)
      speak(`Nu tot en met ${word(endNumber)}`, state.friendlyRate, {interrupt:true})
    }

    state.moving = state.wave >= 2
    state.requiredNext = state.minNumber
    setPastelForWave(state.wave)
    createWaveBubbles()
    setLadybugDefault()
    badge.textContent = `Tik de cijfers op volgorde`
    state.lastInteraction = performance.now()
  }

  function tick(ts){
    maybeShowHelper()
    if(!state.moving){ state.lastTime = ts; state.animationRAF = requestAnimationFrame(tick); return }
    if(!state.lastTime) state.lastTime = ts
    const dt = Math.min(0.05, (ts - state.lastTime) / 1000); state.lastTime = ts
    const W = app.clientWidth, H = app.clientHeight

    for(let i=0;i<state.bubbles.length;i++){
      const el = state.bubbles[i], v = state.velocities[i]
      let x = parseFloat(el.dataset.x), y = parseFloat(el.dataset.y)
      const s = parseFloat(el.dataset.size)
      const meta = state.jerkMeta.get(el), now = performance.now()
      if(meta && now >= meta.nextJerk){
        const sp = rand(state.minSpeed*0.8, state.maxSpeed*1.1), angle = rand(0, Math.PI*2)
        v.vx = Math.cos(angle)*sp; v.vy = Math.sin(angle)*sp
        meta.nextJerk = now + rand(220, 600)
      }
      v.vx += rand(-5, 5) * dt; v.vy += rand(-5, 5) * dt

      x += v.vx * dt; y += v.vy * dt
      if(x <= 0){ x = 0; v.vx = Math.abs(v.vx)*0.98 }
      if(y <= 0){ y = 0; v.vy = Math.abs(v.vy)*0.98 }
      if(x + s >= W){ x = W - s; v.vx = -Math.abs(v.vx)*0.98 }
      if(y + s >= H){ y = H - s; v.vy = -Math.abs(v.vy)*0.98 }

      el.dataset.x = x; el.dataset.y = y
      setTransform(el, x, y)
    }
    if(Math.floor(performance.now()/1000)%2===0){ enforceStacking() }
    state.animationRAF = requestAnimationFrame(tick)
  }

  async function enterFullscreen(){
    const el = document.documentElement
    try{ if(el.requestFullscreen) await el.requestFullscreen(); else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen() }catch(e){}
  }

  async function start(){
    await enterFullscreen()
    resize()
    await ensureTTSReady()

    state.wave = 1; state.requiredNext = state.minNumber; state.moving = false
    state.gameStarted = true
    setPastelForWave(state.wave); clearBubbles(); createWaveBubbles()
    badge.textContent = `Tik de cijfers op volgorde`
    startOverlay.classList.add('hidden')
    setLadybugDefault()

    speak('Start', state.friendlyRate, {interrupt:true})
    speak(`Tik ${word(state.minNumber)}`, state.numberRate, {interrupt:false})
    try{ if(state.musicEnabled) await bgm.play(); else bgm.pause() }catch(e){}
    bgm.volume = state.musicVolume
    updateMusicButtonUI()

    state.lastInteraction = performance.now()
    cancelAnimationFrame(state.animationRAF)
    state.lastTime = 0
    state.animationRAF = requestAnimationFrame(tick)
  }
  function reset(){ setLadybugEmotion('neutral'); start() }

  function openTeacherPanelSecure(){
    const a = 4
    const b = Math.floor(Math.random()*9)+1
    const correct = a*b
    const ans = prompt(`Beveiliging, los op: ${a} x ${b} = ?`)
    if(ans === null) return
    if(parseInt(ans,10) === correct){
      teacherPanel.classList.toggle('show')
      if(teacherPanel.classList.contains('show')) loadSettings()
    }else{
      alert('Niet goed, probeer opnieuw')
    }
  }

  startBtn.addEventListener('click', async () => { await ensureTTSReady(); start() })
  nogeensBtn.addEventListener('click', reset)
  inputMinNumber.addEventListener('input', () => {
    minNumberValue.textContent = inputMinNumber.value
  })
  inputMaxWave.addEventListener('input', () => {
    const max = clampInt(parseInt(inputMaxWave.value,10), 3, 100)
    inputMinNumber.max = max
    if(parseInt(inputMinNumber.value,10) > max){
      inputMinNumber.value = max
    }
    minNumberValue.textContent = inputMinNumber.value
  })
  vraagBtn.addEventListener('click', async () => {
    setLadybugDefault()
    await ensureTTSReady()
    const endNumber = currentMaxNumber()
    speak(`Tik de cijfers op volgorde van ${word(state.minNumber)} tot en met ${word(endNumber)}`, state.friendlyRate, {interrupt:true})
  })

  teacherBtn.addEventListener('click', openTeacherPanelSecure)
  closeTeacher.addEventListener('click', () => teacherPanel.classList.remove('show'))
  saveTeacher.addEventListener('click', () => { saveSettings(); teacherPanel.classList.remove('show') })

  if (previewBtn) previewBtn.addEventListener('click', () => openLogOverlay('teacher'))
  if (logBtn) logBtn.addEventListener('click', () => openLogOverlay('public'))
  if (closeLogBtn) closeLogBtn.addEventListener('click', closeLogOverlay)
  if (clearLogBtn) clearLogBtn.addEventListener('click', () => { writeJSON(LOG_KEY, []); renderLogIntoOverlay() })
  if (resetTeacher) resetTeacher.addEventListener('click', resetSettingsToDefault)

  logOverlay.addEventListener('click', e => { if(e.target === logOverlay) closeLogOverlay() })

  if (musicBtn) musicBtn.addEventListener('click', toggleMusic)

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible'){
      pauseAllAudioForHiddenState()
    }else{
      resumeMusicAfterHiddenState()
    }
  })

  window.addEventListener('pagehide', pauseAllAudioForHiddenState)
  window.addEventListener('blur', () => {
    if(document.visibilityState !== 'visible'){
      pauseAllAudioForHiddenState()
    }
  })

  window.addEventListener('focus', () => {
    if(document.visibilityState === 'visible'){
      resumeMusicAfterHiddenState()
    }
  })

  const oncePrime = async () => { await ensureTTSReady(); document.removeEventListener('pointerdown', oncePrime) }
  document.addEventListener('pointerdown', oncePrime, {passive:true})

  ;['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => { state.lastInteraction = performance.now(); hideHelper() }, {passive:true}))
  resize()

  document.addEventListener('touchmove', e => {
    if(e.target.closest('#logOverlay') || e.target.closest('#teacherPanel')) return
    e.preventDefault()
  }, {passive:false})

  // sneltoetsen, L opent log, Esc sluit
  document.addEventListener('keydown', e => {
    if(e.key === 'l' || e.key === 'L'){ openLogOverlay() }
    if(e.key === 'Escape'){ closeLogOverlay() }
  }, {passive:true})

  loadSettings()
  updateMusicButtonUI()
  closeLogOverlay()
})();
</script>
</body>
</html>
